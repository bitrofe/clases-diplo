openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: energy
    description: Energy consumption records and summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /energy/records:
    get:
      operationId: listEnergyRecords
      tags: [energy]
      summary: List energy consumption records
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: equipment
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Energy consumption records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EnergyRecord" }
    post:
      operationId: importEnergyRecords
      tags: [energy]
      summary: Import energy consumption records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnergyRecordImport"
      responses:
        "201":
          description: Imported records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EnergyRecord" }
  /energy/records/{id}:
    delete:
      operationId: deleteEnergyRecord
      tags: [energy]
      summary: Delete an energy consumption record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Record deleted
        "404":
          description: Record not found
  /energy/summary:
    get:
      operationId: getEnergySummary
      tags: [energy]
      summary: Get energy consumption totals and equipment summaries
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: equipment
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Energy usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnergySummary"
  /energy/equipment:
    get:
      operationId: listEnergyEquipment
      tags: [energy]
      summary: List equipment with consumption summaries
      responses:
        "200":
          description: Equipment summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EquipmentSummary" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EnergyRecord:
      type: object
      required: [id, equipment, measuredAt, consumptionKwh]
      properties:
        id: { type: integer }
        equipment: { type: string }
        measuredAt: { type: string, format: date }
        consumptionKwh: { type: number }
        costEur: { type: ["number", "null"] }
    EnergyRecordInput:
      type: object
      required: [equipment, measuredAt, consumptionKwh]
      properties:
        equipment: { type: string, minLength: 1, maxLength: 160 }
        measuredAt: { type: string, format: date }
        consumptionKwh: { type: number, minimum: 0 }
        costEur: { type: ["number", "null"], minimum: 0 }
    EnergyRecordImport:
      type: object
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/EnergyRecordInput" }
    EquipmentSummary:
      type: object
      required: [equipment, totalKwh, totalCostEur, recordCount, sharePercent]
      properties:
        equipment: { type: string }
        totalKwh: { type: number }
        totalCostEur: { type: number }
        recordCount: { type: integer }
        sharePercent: { type: number }
    EnergyMonthlySummary:
      type: object
      required: [month, totalKwh, totalCostEur]
      properties:
        month: { type: string }
        totalKwh: { type: number }
        totalCostEur: { type: number }
    EnergySummary:
      type: object
      required: [totalKwh, totalCostEur, recordCount, equipmentCount, previousTotalKwh, changePercent, monthly, equipment]
      properties:
        totalKwh: { type: number }
        totalCostEur: { type: number }
        recordCount: { type: integer }
        equipmentCount: { type: integer }
        previousTotalKwh: { type: number }
        changePercent: { type: number }
        monthly:
          type: array
          items: { $ref: "#/components/schemas/EnergyMonthlySummary" }
        equipment:
          type: array
          items: { $ref: "#/components/schemas/EquipmentSummary" }

